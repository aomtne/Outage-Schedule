                        const overrides = type === 'ndt' ? state.ndtOverrides : state.etOverrides;

                    const clickX = e.clientX - rect.left + barsEl.scrollLeft;

                    // Calculate split date from click position
                    const splitDate = pxToDate(clickX);
                    splitDate.setHours(0,0,0,0);
                    const splitDateStr = splitDate.toISOString().slice(0,10);

                    // Get current bar's start and end
                    const barStartStr = bar.dataset.s;
                    const barEndStr = bar.dataset.e;
                    const barStart = new Date(barStartStr);
                    const barEnd = new Date(barEndStr);

                    // Ensure split point is inside the bar with at least 1 day margin
                    const oneDay = 864e5;
                    if (splitDate <= new Date(barStart.getTime() + oneDay) || splitDate >= new Date(barEnd.getTime() - oneDay)) return;

                    // Determine which split array to update
                    const splits = bType === 'ndt' ? state.ndtSplits : state.etSplits;

                    // If bar already has splits, split the affected segment
                    if (key in splits) {
                        const segments = splits[key];

                        // Find which segment contains the split point
                        for (let i = 0; i < segments.length; i++) {
                            const seg = segments[i];
                            const segStart = new Date(seg.start);
                            const segEnd = new Date(seg.end);
                            if (splitDate >= segStart && splitDate < segEnd) {

                            const pc = seg.pc;
                            // Replace segment with two new ones
                            const newSeg1 = { start: seg.start, end: splitDateStr, pc };
                            const newSeg2 = { start: splitDateStr, end: seg.end, pc };

                });

                let applied = 0, skipped = 0;
                // Track which recKeys already had their first NDT/ET segment imported (for building splits)
                const ndtSegments = {};  // recKey → [{start, end, pc}]
                const etSegments = {};

                rows.forEach(row => {
                    const label = String(row['機組名稱'] || '').trim();
                    const ovStart = String(row['大修開始日'] || '').trim();
                    const ovEnd = String(row['大修結束日'] || '').trim();
                    if (!label || !ovStart) { skipped++; return; }

                    const lk = label + '|' + ovStart;
                    const recKey = recLookup[lk];
                    if (!recKey) { skipped++; return; }

                    // NDT
                    const ndtS = String(row['NDT開始日'] || '').trim();
                    const ndtE = String(row['NDT結束日'] || '').trim();
                    const ndtPC = row['NDT人數'];
                    if (ndtS && ndtE) {
                        if (!ndtSegments[recKey]) ndtSegments[recKey] = [];
                        ndtSegments[recKey].push({
                            start: ndtS, end: ndtE,
                            pc: (ndtPC !== '' && ndtPC !== null && ndtPC !== undefined) ? Number(ndtPC) : null
                        });
                    }

                    // ET
                    const etS = String(row['ET開始日'] || '').trim();
                    const etE = String(row['ET結束日'] || '').trim();
                    const etPC = row['ET人數'];
                    if (etS && etE) {
                        if (!etSegments[recKey]) etSegments[recKey] = [];
                        etSegments[recKey].push({
                            start: etS, end: etE,
                            pc: (etPC !== '' && etPC !== null && etPC !== undefined) ? Number(etPC) : null
                        });
                    }

                    applied++;
                });

                // Apply to state: single segment → override, multiple segments → splits
                for (const [recKey, segs] of Object.entries(ndtSegments)) {
                    if (segs.length === 1) {
                        state.ndtOverrides[recKey] = { start: segs[0].start, end: segs[0].end };
                        if (segs[0].pc !== null) state.ndtPCOverrides[recKey] = segs[0].pc;
                    } else {
                        state.ndtSplits[recKey] = segs;
                    }
                }
                for (const [recKey, segs] of Object.entries(etSegments)) {
                    if (segs.length === 1) {
                        state.etOverrides[recKey] = { start: segs[0].start, end: segs[0].end };
                        if (segs[0].pc !== null) state.etPCOverrides[recKey] = segs[0].pc;
                    } else {
                        state.etSplits[recKey] = segs;
                    }
                }

                // Show reset button
                const resetBtn = document.getElementById('resetOverrides');
                if (resetBtn) resetBtn.style.display = '';

                // Ensure NDT/ET toggles are on
                if (!state.showNDT) {
                    state.showNDT = true;
                    document.getElementById('showNDT').checked = true;
                    document.getElementById('legNDT').style.display = '';
                }
                if (!state.showET) {
                    state.showET = true;
                    document.getElementById('showET').checked = true;
                    document.getElementById('legET').style.display = '';
                }

                render();
                alert(`載入完成！已套用 ${applied} 筆排程資料` + (skipped > 0 ? `，${skipped} 筆無法對應` : ''));

                btn.textContent = '載入 Excel'; btn.disabled = false;
            } catch (err) {
                console.error('Excel import error:', err);
                alert('Excel載入失敗: ' + err.message);
                btn.textContent = '載入 Excel'; btn.disabled = false;
            }
            // Reset file input so same file can be re-selected
            e.target.value = '';
        });

        // ======================== PPTX 匯入 ========================

        const REGION_MAP = {
            '林口':'北部','大潭':'北部','協和':'北部','和平':'北部','核二':'北部',
            '通霄':'中部','星元':'北部','麥寮':'北部',
            '台中':'中部','嘉惠':'南部','星彰':'中部',
            '大林':'南部','南部':'南部','核三':'南部','興達':'南部','豐德':'南部','興達新':'南部',
        };
        const PLANT_TYPE_MAP = {
            '核二':'核能','核三':'核能',
            '大潭':'複循環','通霄':'複循環','南部':'複循環','興達新':'複循環',
            '和平':'IPP','嘉惠':'IPP','豐德':'IPP','星元':'IPP','星彰':'IPP','麥寮':'IPP',
        };

        function getPlantKey(name) {
            for (const k of Object.keys(REGION_MAP)) {
                if (name.startsWith(k)) return k;
            }
            return name.slice(0,2);
        }
        function getPlantTypeFromKey(pk, unit) {
            if (PLANT_TYPE_MAP[pk]) return PLANT_TYPE_MAP[pk];
            if (/CC|GT\d|ST\d/.test(unit)) return '複循環';
            return '火力';
        }

        // 更新年度/電廠選單（動態資料載入後呼叫）
        function refreshDataUI() {
            const years = [...new Set(data.map(d=>d.year))].sort((a,b)=>a-b);
            const yc = document.getElementById('yearCtrl');
            yc.innerHTML = '';
            years.forEach(y => {
                const lbl = document.createElement('label');
                lbl.className = 'chk';
                lbl.innerHTML = `<input type="checkbox" ${state.years.has(String(y))?'checked':''}>${y}`;
                lbl.querySelector('input').addEventListener('change', e => {

                    else state.years.delete(String(y));

            const pl = document.getElementById('plantList');
            pl.innerHTML = '';
            plants.forEach(p => {

                lbl.className = 'chk';
                lbl.innerHTML = `<input type="checkbox" data-plant="${p}">${p}`;
                lbl.querySelector('input').addEventListener('change', e => {

                    else state.plants.delete(p);
                    document.getElementById('pAll').checked = state.plants.size === 0;
                    render();

        }

        // ---- 日期解析 ----
        const DATE_RE = /(?:(\d{3})\/)?(\d{1,2})\/(\d{1,2})-(?:(\d{3})\/)?(\d{1,2})\/(\d{1,2})/;

        function parseDateRange(s, baseRoc) {
            s = String(s||'').replace(/[（(][^）)]*[）)]/g,'').replace(/[~～].*/,'').trim().replace(/\s+/g,'');
            const m = s.match(DATE_RE);
            if (!m) return [null,null];
            const hasY1=!!m[1], hasY2=!!m[4];
            const sm=+m[2], sd=+m[3], em=+m[5], ed=+m[6];
            if (!(sm>=1&&sm<=12&&sd>=1&&sd<=31&&em>=1&&em<=12&&ed>=1&&ed<=31)) return [null,null];
            let sy, ey;
            if (hasY1&&hasY2) { sy=+m[1]; ey=+m[4]; }
            else if (hasY1) { sy=+m[1]; ey=sy+(em<sm||(em===sm&&ed<=sd)?1:0); }
            else if (hasY2) { ey=+m[4]; sy=ey-(sm>em||(sm===em&&sd>ed)?1:0); }
            else {
                if (sm>=10&&em<=6) { sy=baseRoc; ey=baseRoc+1; }
                else { sy=baseRoc; ey=sy+(em<sm||(em===sm&&ed<sd)?1:0); }
            }
            const fmt=(y,mo,d)=>`${y+1911}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const start=fmt(sy,sm,sd), end=fmt(ey,em,ed);
            if (new Date(end)<new Date(start)) return [null,null];
            return [start,end];
        }

        // ---- PPTX 形狀解析 ----
        function parsePptxShape(raw, baseRoc) {
            const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
            if (!lines.length) return [];
            const first = lines[0];
            const records = [];
            function makeRec(plant, unit, start, end, type, region) {
                return {year:baseRoc, plant, unit, start, end,
                    days:Math.ceil((new Date(end)-new Date(start))/864e5), type, region};
            }
            // 1. CC 複循環
            const ccM = first.match(/^([^\s（(#\d、]+)(CC[#＃]?\d+)/);
            if (ccM) {
                const plant=ccM[1]; let ccNum=ccM[2].replace('＃','#');
                if (!/CC#/.test(ccNum)) ccNum=ccNum.replace(/CC(\d)/,'CC#$1');
                const pk=getPlantKey(plant), region=REGION_MAP[pk]||'北部';
                for (const line of lines.slice(1)) {
                    const gts=line.match(/^(GT|ST)(\d+)\s+(.*)/i);
                    if (gts) {
                        const item=gts[1].toUpperCase()+gts[2];
                        const [start,end]=parseDateRange(gts[3],baseRoc);
                        if (start&&end) records.push(makeRec(plant,`${ccNum} ${item}`,start,end,'複循環',region));
                    }
                }
                return records;
            }
            // 2. 獨立 GT/ST（電廠名直接接GT/ST，無 #）
            const gtM = first.match(/^([^\s（(#\d、]+)(GT|ST)(\d+)\s*(.*)/i);
            if (gtM && !/#/.test(gtM[1])) {
                const plant=gtM[1], item=gtM[2].toUpperCase()+gtM[3];
                const pk=getPlantKey(plant), region=REGION_MAP[pk]||'北部';
                let [start,end]=parseDateRange(gtM[4],baseRoc);
                if (!start) { for (const l of lines.slice(1)) { [start,end]=parseDateRange(l,baseRoc); if(start)break; } }
                if (start&&end) records.push(makeRec(plant,item,start,end,getPlantTypeFromKey(pk,item),region));
                return records;
            }
            // 3. 標準機組 #N（含可能的 GT/ST 子項）
            const unitM = first.match(/^([^\s（(#\d、]+)([#＃]\d+(?:[、,][#＃]?\d+)*)/);
            if (unitM) {
                const plant=unitM[1], unitRaw=unitM[2].replace(/＃/g,'#');
                const pk=getPlantKey(plant), region=REGION_MAP[pk]||'北部';
                const hasGtSub=lines.slice(1).some(l=>/^(GT|ST)\d+/i.test(l));
                if (hasGtSub) {
                    for (const line of lines.slice(1)) {
                        const gts=line.match(/^(GT|ST)(\d+)\s+(.*)/i);
                        if (gts) {
                            const item=gts[1].toUpperCase()+gts[2];
                            const [start,end]=parseDateRange(gts[3],baseRoc);
                            if(start&&end) records.push(makeRec(plant,`${unitRaw} ${item}`,start,end,getPlantTypeFromKey(pk,item),region));
                        }
                    }
                } else {
                    const u0=unitRaw.replace(/[、,].*/,'');
                    for (const line of lines) {
                        const [start,end]=parseDateRange(line,baseRoc);
                        if(start&&end) { records.push(makeRec(plant,u0,start,end,getPlantTypeFromKey(pk,u0),region)); break; }
                    }
                }
                return records;
            }
            // 4. IPP ST/GT 無 #（嘉惠ST2、星元 等）
            const stM = first.match(/^([^\s（(#\d]+)(ST|GT)(\d*)\s*(.*)/i);
            if (stM) {
                const plant=stM[1], item=stM[2].toUpperCase()+stM[3];
                const pk=getPlantKey(plant), region=REGION_MAP[pk]||'中部';
                let [start,end]=parseDateRange(stM[4],baseRoc);
                if (!start) { for (const l of lines.slice(1)) { [start,end]=parseDateRange(l,baseRoc); if(start)break; } }
                if (start&&end) records.push(makeRec(plant,item,start,end,getPlantTypeFromKey(pk,item),region));
            }
            return records;
        }

        // ---- PPTX 主解析（JSZip + DOMParser）----
        const NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
        const NS_P = 'http://schemas.openxmlformats.org/presentationml/2006/main';
        const SKIP_PPTX = ['年度各區','版本：','除夕','台灣電力公司','修護處','調度處','發電處','電廠：','董事長','配合調整','EOH'];

        async function parsePptxSchedule(file) {
            const ab = await file.arrayBuffer();
            await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
            const zip = await JSZip.loadAsync(ab);
            const allRecords = [];
            const slideNames = Object.keys(zip.files)
                .filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
                .sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
            for (let i=0; i<slideNames.length; i++) {
                const xmlStr = await zip.files[slideNames[i]].async('string');
                const doc = new DOMParser().parseFromString(xmlStr,'text/xml');
                let baseRoc = 114+(i+1);
                const allT = doc.getElementsByTagNameNS(NS_A,'t');
                const fullText = Array.from(allT).map(t=>t.textContent).join('');
                const ym = fullText.match(/(\d{3})年度各區機組大修排程圖/);
                if (ym) baseRoc = parseInt(ym[1]);
                const spEls = Array.from(doc.getElementsByTagNameNS(NS_P,'sp'));
                for (const sp of spEls) {
                    const txBody = sp.getElementsByTagNameNS(NS_P,'txBody')[0];
                    if (!txBody) continue;
                    const paras = Array.from(txBody.getElementsByTagNameNS(NS_A,'p'));
                    const paraTexts = paras.map(p=>{
                        const runs=Array.from(p.getElementsByTagNameNS(NS_A,'r'));
                        return runs.map(r=>{const t=r.getElementsByTagNameNS(NS_A,'t')[0];return t?t.textContent:'';}).join('');
                    }).filter(t=>t.trim());
                    if (!paraTexts.length) continue;
                    const shapeText = paraTexts.join('\n');
                    if (shapeText.length<3||SKIP_PPTX.some(p=>shapeText.includes(p))) continue;
                    allRecords.push(...parsePptxShape(shapeText,baseRoc));
                }
            }
            return allRecords;
        }

        // ---- 預覽/編輯 Modal ----
        const MODAL_TYPES   = ['火力','核能','複循環','水力','IPP'];
        const MODAL_REGIONS = ['北部','中部','南部'];

        function makeSelect(opts, val) {
            return `<select>${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`;
        }
        function addPreviewRow(tbody, rec) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${makeSelect(MODAL_REGIONS,rec.region)}</td>
                <td><input type="text" value="${rec.plant||''}"></td>
                <td><input type="text" value="${rec.unit||''}"></td>
                <td>${makeSelect(MODAL_TYPES,rec.type)}</td>
                <td><input type="date" value="${rec.start||''}"></td>
                <td><input type="date" value="${rec.end||''}"></td>
                <td><button class="del-row-btn" title="刪除此列">✕</button></td>`;
            tr.querySelector('.del-row-btn').addEventListener('click', ()=>{ tr.remove(); updateCount(); highlightDuplicates(); });
            tr.querySelectorAll('input[type=date]').forEach(inp => inp.addEventListener('change', highlightDuplicates));
            tbody.appendChild(tr);
        }
        function updateCount() {
            const n = document.querySelectorAll('#previewTable tbody tr').length;
            document.querySelector('#previewFooter .cnt').textContent = `共 ${n} 筆`;
        }

        // ---- 排序 ----
        let _sortCol = -1, _sortAsc = true;
        function getRowSortVal(tr, col) {
            const sels = tr.querySelectorAll('select');
            const inputs = tr.querySelectorAll('input');
            // col mapping: 0=地區(sel0), 1=電廠(input0), 4=開始日期(input2)
            if (col === 0) return sels[0] ? sels[0].value : '';
            if (col === 1) return inputs[0] ? inputs[0].value : '';
            if (col === 4) return inputs[2] ? inputs[2].value : '';
            return '';
        }
        function sortPreviewTable(col) {
            const tbody = document.querySelector('#previewTable tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            if (_sortCol === col) _sortAsc = !_sortAsc;
            else { _sortCol = col; _sortAsc = true; }
            rows.sort((a, b) => {
                const va = getRowSortVal(a, col), vb = getRowSortVal(b, col);
                return _sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
            });
            rows.forEach(r => tbody.appendChild(r));
            // Update header icons
            // ---- 篩選 ----
        function filterPreviewTable() {
            const region = document.getElementById('fRegion').value;
            const plant  = document.getElementById('fPlant').value.trim().toLowerCase();
            const type   = document.getElementById('fType').value;
            const rows   = Array.from(document.querySelectorAll('#previewTable tbody tr'));
            let visible  = 0;
            rows.forEach(tr => {
                const sels   = tr.querySelectorAll('select');
                const inputs = tr.querySelectorAll('input');
                const rRegion = sels[0]?.value || '';
                const rPlant  = (inputs[0]?.value || '').toLowerCase();
                const rType   = sels[1]?.value || '';
                const match = (!region || rRegion === region)
                           && (!plant  || rPlant.includes(plant))
                           && (!type   || rType === type);
                tr.classList.toggle('hidden-row', !match);
                if (match) visible++;
            });
            const total = rows.length;
            document.getElementById('filterCount').textContent =
                (visible < total) ? `顯示 ${visible} / ${total} 筆` : '';
        }

        ['fRegion','fType'].forEach(id =>
            document.getElementById(id).addEventListener('change', filterPreviewTable));
        document.getElementById('fPlant').addEventListener('input', filterPreviewTable);
        document.getElementById('clearFilter').addEventListener('click', () => {
            document.getElementById('fRegion').value = '';
            document.getElementById('fPlant').value  = '';
            document.getElementById('fType').value   = '';
            filterPreviewTable();
        });

        document.querySelectorAll('#previewTable th.sortable').forEach(th => {
                th.classList.remove('sort-asc','sort-desc');
                if (parseInt(th.dataset.col) === col)
                    th.classList.add(_sortAsc ? 'sort-asc' : 'sort-desc');
            });
        }
        document.querySelectorAll('#previewTable th.sortable').forEach(th => {
            th.addEventListener('click', () => { sortPreviewTable(parseInt(th.dataset.col)); highlightDuplicates(); });
        });

        // ---- 重複日期高亮 ----
        function highlightDuplicates() {
            const rows = Array.from(document.querySelectorAll('#previewTable tbody tr'));
            // Count occurrences of each start+end pair
            const freq = {};
            rows.forEach(tr => {
                const inputs = tr.querySelectorAll('input[type=date]');
                const key = (inputs[0]?.value||'') + '|' + (inputs[1]?.value||'');
                freq[key] = (freq[key]||0) + 1;
            });
            rows.forEach(tr => {
                const inputs = tr.querySelectorAll('input[type=date]');
                const key = (inputs[0]?.value||'') + '|' + (inputs[1]?.value||'');
                if (freq[key] >= 2 && (inputs[0]?.value||inputs[1]?.value)) {
                    tr.classList.add('dup-row');
                } else {
                    tr.classList.remove('dup-row');
                }
            });
        }
        // ---- 移除機組+開始日期+結束日期三欄完全相同的重複列 ----
        function deduplicatePreviewRows() {
            const rows = Array.from(document.querySelectorAll('#previewTable tbody tr'));
            const seen = new Set();
            let removed = 0;
            rows.forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                const unit  = inputs[1]?.value || '';
                const start = inputs[2]?.value || '';
                const end   = inputs[3]?.value || '';
                const key   = unit + '|' + start + '|' + end;
                if (seen.has(key)) { tr.remove(); removed++; }
                else seen.add(key);
            });
            return removed;
        }

        function showPreviewTable(records) {
            const tbody = document.querySelector('#previewTable tbody');
            tbody.innerHTML = '';
            records.forEach(r=>addPreviewRow(tbody,r));
            const removed = deduplicatePreviewRows();
            updateCount();
            highlightDuplicates();
            // Reset filters on open
            document.getElementById('fRegion').value = '';
            document.getElementById('fPlant').value  = '';
            document.getElementById('fType').value   = '';
            document.getElementById('filterCount').textContent = '';
            document.getElementById('previewModal').classList.add('open');
            if (removed > 0) {
                document.querySelector('#previewFooter .cnt').textContent +=
                    `　（已自動移除 ${removed} 筆重複）`;
            }
        }

        document.getElementById('previewAddRow').addEventListener('click', ()=>{
            const today = new Date().toISOString().slice(0,10);
            addPreviewRow(document.querySelector('#previewTable tbody'),
                {region:'北部',plant:'',unit:'',type:'火力',start:today,end:today});
            updateCount();
        });
        document.getElementById('previewCancel').addEventListener('click', ()=>{
            document.getElementById('previewModal').classList.remove('open');
        });
        document.getElementById('previewConfirm').addEventListener('click', ()=>{
            const rows = document.querySelectorAll('#previewTable tbody tr');
            const newRecords = [];
            rows.forEach(tr=>{
                const sels=tr.querySelectorAll('select'), inputs=tr.querySelectorAll('input');
                const region=sels[0].value, plant=inputs[0].value.trim();
                const unit=inputs[1].value.trim(), type=sels[1].value;
                const start=inputs[2].value, end=inputs[3].value;
                if (!plant||!start||!end) return;
                const days=Math.ceil((new Date(end)-new Date(start))/864e5);
                if (days<1) return;
                const year=parseInt(start.slice(0,4))-1911;
                newRecords.push({year,plant,unit,start,end,days,type,region});
            });
            if (!newRecords.length) { alert('沒有有效資料。'); return; }
            allData.push(...newRecords);
            data = dedup(allData);
            newRecords.forEach(r=>state.years.add(String(r.year)));
            refreshDataUI();
            render();
            document.getElementById('previewModal').classList.remove('open');
            alert(`✅ 已加入 ${newRecords.length} 筆排程到甘特圖！`);
        });

        // ---- 匯入 PPTX 事件 ----
        document.getElementById('importPdfBtn').addEventListener('click', ()=>{
            document.getElementById('importPdfFile').click();
        });
        document.getElementById('importPdfFile').addEventListener('change', async (e)=>{
            const file=e.target.files[0]; if (!file) return;
            const btn=document.getElementById('importPdfBtn');
            btn.disabled=true; btn.textContent='解析中...';
            try {
                const records = await parsePptxSchedule(file);
                if (!records.length) {
                    alert('未能從 PPTX 中解析出有效排程資料。\n請確認為台電大修排程圖格式。');
                } else {
                    showPreviewTable(records);
                }
            } catch(err) {
                console.error('PPTX import error:',err);
                alert('PPTX 解析失敗：'+err.message);
            }
            btn.textContent='匯入 PPTX'; btn.disabled=false;
            e.target.value='';
        });

        // ── 甘特圖 bar 點擊移除 ──
        let _pendingRemove = null; // {plant, unit, start, end, year}

        const removePopup = document.getElementById('removePopup');
        const removeInfo  = document.getElementById('removePopupInfo');

        function showRemovePopup(el, rect) {
            const p = el.dataset.p, u = el.dataset.u;
            const s = el.dataset.s, e = el.dataset.e;
            const y = el.dataset.y;
            _pendingRemove = {plant:p, unit:u, start:s, end:e, year:+y};

            removeInfo.innerHTML =
                `<b>電廠：</b>${p}<br>` +
                `<b>機組：</b>${u||'—'}<br>` +
                `<b>開始：</b>${s}<br>` +
                `<b>結束：</b>${e}<br>` +
                `<b>天數：</b>${el.dataset.d} 天`;

            // Position popup near click, avoid overflow
            const vw = window.innerWidth, vh = window.innerHeight;
            let px = rect.right + 8, py = rect.top;
            removePopup.classList.add('open');
            if (px + 350 > vw) px = rect.left - 350;
            if (py + 180 > vh) py = vh - 190;
            removePopup.style.left = Math.max(4, px) + 'px';
            removePopup.style.top  = Math.max(4, py) + 'px';
        }

        document.getElementById('ganttInner').addEventListener('click', e => {
            const bar = e.target.closest('.gbar');
            if (!bar) return;
            // Ignore NDT/ET bars (they have data-type attribute)
            if (bar.dataset.type) return;
            showRemovePopup(bar, bar.getBoundingClientRect());
        });

        document.getElementById('removeCancelBtn').addEventListener('click', () => {
            removePopup.classList.remove('open');
            _pendingRemove = null;
        });

        document.getElementById('removeConfirmBtn').addEventListener('click', () => {
            if (!_pendingRemove) return;
            const {plant, unit, start, end, year} = _pendingRemove;
            // Remove ALL matching records from allData
            const before = allData.length;
            allData = allData.filter(r =>
                !(r.plant===plant && (r.unit||'')===(unit||'') &&
                  r.start===start  && r.end===end && r.year===year)
            );
            data = dedup(allData);
            refreshDataUI();
            render();
            removePopup.classList.remove('open');
            _pendingRemove = null;
            console.log(`Removed ${before - allData.length} record(s).`);
        });

        // Close popup on outside click
        document.addEventListener('click', e => {
            if (removePopup.classList.contains('open') &&
                !removePopup.contains(e.target) &&
                !e.target.closest('.gbar')) {
                removePopup.classList.remove('open');
                _pendingRemove = null;
            }
        }, true);

        render();
        // Re-render on window resize
        window.addEventListener('resize', ()=>render());
    </script>
</body>
</html>
